# Butterfly, environnement de production : https://butterfly.cheridanh.fr
#
# Manifestes dans k8s/butterfly/prod (base commune et réglages de la production).
#
# Les secrets chiffrés de k8s/butterfly/prod/secrets doivent exister avant l'ajout de
# ce fichier : sans eux, la construction des manifestes échoue et rien n'est déployé.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: butterfly-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:dalton0x0/butterfly-deploy.git
    targetRevision: main
    path: k8s/butterfly/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: butterfly-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
