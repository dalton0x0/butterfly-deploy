# Sealed Secrets : permet de versionner des secrets chiffrés dans ce dépôt.
#
# Un secret est chiffré sur le poste avec kubeseal et la clé publique du contrôleur. Seul
# le contrôleur qui détient la clé privée peut le déchiffrer : le fichier chiffré se
# commite sans risque et Argo CD l'applique comme le reste.
#
# La clé privée n'existe que dans le cluster. Sa sauvegarde (hors de Git) et sa
# restauration sont décrites dans k8s/README.md : sans elle, un cluster reconstruit ne
# pourrait plus lire aucun des secrets du dépôt.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      valuesObject:
        # Nom et namespace attendus par défaut par kubeseal : aucune option à lui passer.
        fullnameOverride: sealed-secrets-controller
        # Pas de nouvelle clé tous les 30 jours (comportement par défaut). Chaque clé
        # générée devrait être sauvegardée sous peine de perdre les secrets chiffrés
        # avec elle. Une seule clé renouvelée à la main avec sa sauvegarde reste simple
        # à protéger. Le renouvellement ne rechiffre de toute façon pas les secrets
        # existants.
        keyrenewperiod: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
