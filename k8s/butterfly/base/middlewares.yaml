# Middlewares Traefik, utilisés par les Ingress de chaque environnement.
#
# Une Ingress les désigne par <namespace>-<nom>@kubernetescrd : voir ingress.yaml dans
# chaque environnement.

# Redirection permanente de HTTP vers HTTPS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HSTS : une fois la réponse reçue, le navigateur n'utilise plus que HTTPS pour ce
# domaine pendant un an, même si l'utilisateur tape http://. Une attaque qui
# intercepterait la première requête en clair n'a plus de prise.
#
# Ajouté ici et non dans nginx : c'est Traefik qui termine le HTTPS. Sous Docker
# Compose, sans HTTPS, l'en-tête n'aurait pas de sens.
#
# Attention : le navigateur refuse alors tout certificat invalide, sans possibilité de
# passer outre. Un certificat de test (non reconnu) bloquerait l'accès au site.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 31536000
