# API Spring Boot.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
---
# Fichiers téléversés (rendus, pièces jointes, images, vidéos).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
  labels:
    app.kubernetes.io/name: backend
  annotations:
    # Argo CD ne supprime jamais ce volume, même si le fichier disparaît du dépôt ou si
    # l'application est supprimée. Une suppression reste possible, mais à la main.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ ReadWriteOnce ]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  # Recreate : l'ancien pod s'arrête avant le démarrage du nouveau. Une mise à jour
  # coupe donc le service une minute environ, le temps du démarrage.
  # Une mise à jour progressive éviterait cette coupure, mais ferait tourner deux
  # backends ensemble : deux fois la mémoire, et les tâches planifiées (notifications,
  # nettoyages) exécutées en double pendant la transition.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # Les images sont privées : identifiants de lecture de GHCR.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # Utilisateur butterfly créé par le Dockerfile, avec un UID fixe.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/dalton0x0/butterfly
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Configuration non sensible, puis secrets (clé JWT, compte administrateur,
            # identifiants SMTP). Les clés de ces objets sont les noms des variables.
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: DB_PASSWORD
          # Points de santé de Spring Boot (management.endpoint.health.probes).
          # startupProbe : le démarrage, migrations Flyway comprises, peut prendre plus
          # d'une minute. Les deux autres contrôles ne commencent qu'après sa réussite.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            # Jusqu'à 3 minutes.
            failureThreshold: 36
          # liveness : l'application est bloquée, Kubernetes redémarre le conteneur.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # readiness : l'application ne peut pas répondre pour l'instant, le Service
          # cesse de lui envoyer des requêtes, sans redémarrage.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          # Même plafond que sous Docker Compose. La JVM règle sa mémoire sur cette
          # limite (JAVA_OPTS du Dockerfile : 75 % pour le tas).
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ ALL ]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
