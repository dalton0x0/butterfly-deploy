# Base de données MySQL.
#
# StatefulSet et non Deployment : le pod garde le même nom et le même volume d'un
# redémarrage à l'autre, et Kubernetes n'en lance jamais deux en même temps sur les
# mêmes données.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
spec:
  # Service « headless », exigé par le StatefulSet : le nom mysql résout directement
  # l'adresse du pod.
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
    spec:
      # Par défaut, Kubernetes injecte dans chaque conteneur des variables décrivant
      # les Services du namespace (MYSQL_PORT, REDIS_PORT...). Leurs noms peuvent entrer
      # en collision avec ceux qu'attendent les applications : désactivé partout.
      enableServiceLinks: false
      # Aucun appel à l'API Kubernetes : pas de jeton monté dans le conteneur.
      automountServiceAccountToken: false
      # Laisse à MySQL le temps de vider ses tampons sur le disque à l'arrêt.
      terminationGracePeriodSeconds: 60
      securityContext:
        # Utilisateur mysql de l'image (UID 999). L'image prévoit ce mode de
        # fonctionnement : sans root, elle saute simplement le changement de
        # propriétaire des dossiers.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            # Même nom de base que le backend, lu dans sa configuration : une seule
            # valeur à modifier.
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_NAME
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: DB_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: DB_PASSWORD
          # Contrôles par TCP (-h 127.0.0.1) et non par le socket local. Au premier
          # démarrage, l'image lance un serveur temporaire, joignable par le socket
          # seulement, le temps de créer la base. Le contrôle par TCP ne réussit
          # qu'une fois le vrai serveur prêt.
          # Aucun mot de passe : mysqladmin ping répond « vivant » même quand l'accès
          # est refusé.
          startupProbe:
            exec:
              command: [ "mysqladmin", "ping", "-h", "127.0.0.1" ]
            periodSeconds: 10
            timeoutSeconds: 5
            # Jusqu'à 5 minutes pour l'initialisation d'une base vierge.
            failureThreshold: 30
          livenessProbe:
            exec:
              command: [ "mysqladmin", "ping", "-h", "127.0.0.1" ]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [ "mysqladmin", "ping", "-h", "127.0.0.1" ]
            periodSeconds: 10
            timeoutSeconds: 5
          # Pas de limite de processeur : elle ralentirait le service même quand la
          # machine est libre. La limite de mémoire protège les voisins.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ ALL ]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  # Volume créé une fois par le StatefulSet, puis conservé. Supprimer le StatefulSet
  # ne supprime pas ce volume.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ ReadWriteOnce ]
        resources:
          requests:
            storage: 5Gi
