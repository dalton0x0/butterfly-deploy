# Vérifications à chaque poussée et à chaque pull request.
#
# Ce dépôt ne contient aucun code applicatif : il n'y a donc ni test ni
# construction. Les erreurs qu'on peut attraper automatiquement ici sont une
# faute de syntaxe ou une référence cassée dans le docker-compose.yml et un
# catalogue des réglages du backend incomplet ou contenant un nom inconnu.
#
# La commande config résout les variables, valide la structure et n'exécute rien.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  compose:
    name: Validation du fichier compose
    runs-on: ubuntu-latest

    steps:
      - name: Récupération des sources
        uses: actions/checkout@v7

      - name: Validation de la syntaxe
        # BACKEND_PATH et FRONTEND_PATH pointent vers le répertoire courant :
        # les deux autres dépôts ne sont pas clonés ici et compose refuse un
        # contexte de construction inexistant. Rien n'étant construit, le
        # contenu du répertoire visé n'a aucune importance.
        #
        # --env-file .env.example : le vrai .env n'est pas versionné. Le fichier
        # d'exemple porte les mêmes clés, ce qui suffit à résoudre les ${...}.
        run: |
          BACKEND_PATH=. FRONTEND_PATH=. \
            docker compose --env-file .env.example config --quiet

      - name: Validation du complément de pré-production
        # DOMAIN et ACME_EMAIL sont commentés dans l'exemple : des valeurs factices
        # suffisent, la commande ne contacte personne.
        run: |
          BACKEND_PATH=. FRONTEND_PATH=. DOMAIN=preprod.example.test ACME_EMAIL=ci@example.test \
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.preprod.yml config --quiet

  backend-env:
    name: Catalogue des réglages du backend
    runs-on: ubuntu-latest

    steps:
      - name: Récupération des sources
        uses: actions/checkout@v7

      # Les noms des variables sont lus dans les fichiers de configuration du backend à
      # jour sur sa branche main.
      - name: Récupération du backend
        uses: actions/checkout@v7
        with:
          repository: dalton0x0/butterfly
          path: backend-src

      - name: Vérification du catalogue
        run: scripts/check-backend-env.sh backend-src
